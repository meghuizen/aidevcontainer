name: aidev

services:
  dev:
    build:
      context: ..
      dockerfile: Dockerfile
      # Only knobs worth overriding from here. Everything else (UBUNTU_TAG,
      # NODE_MAJOR, NODE_VERSION) stays at its Dockerfile ARG default so there is
      # one place to bump it.
      args:
        GH_RUNNER_VERSION: "2.336.0"
        AZP_AGENT_VERSION: "5.277.0"
        RTK_VERSION: ""
        # x86-64-v3 optimized Ubuntu packages (AVX2/FMA/BMI2).
        # Set to "0" if this image must run on a pre-2013 CPU.
        ENABLE_AMD64V3: "1"
    image: aidev:latest
    init: true
    hostname: aidev
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    # The hard ceilings here are what the container actually gets — pam_limits
    # inside the image can only lower them, never raise them.
    ulimits:
      nofile:  { soft: 1048576, hard: 1048576 }
      nproc:   { soft: 262144,  hard: 262144 }
      memlock: { soft: -1, hard: -1 }
      # stack: leave the SOFT limit at the glibc default 8 MB — glibc uses it as the
      # default pthread stack size, so raising it makes every thread reserve 64 MB of
      # address space. Only the hard ceiling is raised, so `ulimit -s` can be bumped
      # per-process when something actually needs deep recursion.
      stack:   { soft: 8388608, hard: 67108864 }
      core:    { soft: 0, hard: 0 }
    # Only namespaced sysctls can be set from compose; vm.* / fs.* are host-wide
    # and would make the container fail to start.
    sysctls:
      net.core.somaxconn: "8192"
      net.ipv4.ip_local_port_range: "10240 65535"
    # /dev/shm default is 64 MB, which Chromium (Playwright) outgrows — it crashes
    # with "Target closed" / SIGBUS. The mssql service sets its own below.
    shm_size: "2gb"
    environment:
      TZ: Europe/Amsterdam
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    # Uncomment to pass GPUs through (requires nvidia-container-toolkit on the host).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    volumes:
      - ../:/workspaces/aidevcontainer:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - pg-data:/var/lib/postgresql/18/main
      - uv-cache:/home/vscode/.cache/uv
      - nuget-cache:/home/vscode/.nuget
      - npm-cache:/home/vscode/.npm
      - pnpm-store:/home/vscode/.cache/pnpm
      - hf-cache:/home/vscode/.cache/huggingface
      - claude-config:/home/vscode/.claude
      - azure-config:/home/vscode/.azure
      # tmpfs long-form: short-form `- /tmp:size=4g,exec` is parsed as a literal path
      # by compose; long-form is the only way to set size.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 4294967296
    command: ["sleep", "infinity"]

  # SQL Server 2025 as its own container rather than baked into the dev image.
  # The engine is 1.45 GB — keeping it out of an image you rebuild often is the
  # single biggest size win, and it upgrades independently of your toolchain.
  #
  # Behind the `mssql` profile so it does NOT start with the dev container (the
  # engine wants ~2 GB of RAM). Start it with `bash scripts/start-mssql.sh` from
  # inside the dev container, or from the host:
  #   docker compose -f .devcontainer/docker-compose.yml --profile mssql up -d mssql
  #
  # From the dev container, connect to host `mssql` (the service name), NOT
  # localhost — the engine is a separate container on the compose network:
  #   SQLCMDPASSWORD="$(cat ~/.mssql-password)" sqlcmd -S mssql,1433 -U sa -No
  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2025-latest
    hostname: mssql
    # No restart policy on purpose. `profiles:` only controls what `up` selects —
    # the daemon enforces restart independently, so `unless-stopped` would bring
    # the 2 GB engine back on every host boot, which is what the profile exists
    # to avoid.
    restart: "no"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Supplied by scripts/start-mssql.sh, which generates it into
      # ~/.mssql-password on first run and exports it.
      #
      # Applied by SQL Server during FIRST-TIME SETUP ONLY. After that the
      # credential lives in master.mdf and this variable is ignored — recreating
      # the container with a different value does not change the password, it just
      # makes every login fail. README.md covers recovery and rotation.
      #
      # Empty default rather than compose's required-variable form (`:?`): compose
      # interpolates the WHOLE file regardless of active profiles, so `:?` here
      # would break `up` for the dev service too. If it is empty, the SQL Server
      # image itself refuses to start with a clear message.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      MSSQL_TCP_PORT: "1433"
      MSSQL_LCID: "1033"
      MSSQL_MEMORY_LIMIT_MB: "4096"
      TZ: Europe/Amsterdam
    # Loopback-only. A bare "1433:1433" publishes on 0.0.0.0, which would put an
    # sa-authenticated engine on every network this host is attached to. Host
    # tools (SSMS, Azure Data Studio) still reach it at localhost,1433.
    ports:
      - "127.0.0.1:1433:1433"
    # NOTE: this volume was previously written by the in-image apt SQL Server,
    # which ran as a system `mssql` user with a dynamically assigned uid. This
    # image runs as uid 10001, so pre-existing data needs a one-time chown —
    # see the SQL Server section in README.md.
    volumes:
      - mssql-data:/var/opt/mssql
    # SQL Server on Linux wants a high fd ceiling and locked pages.
    ulimits:
      nofile:  { soft: 1048576, hard: 1048576 }
      memlock: { soft: -1, hard: -1 }
    shm_size: "1gb"

volumes:
  mssql-data:
  pg-data:
  uv-cache:
  nuget-cache:
  npm-cache:
  pnpm-store:
  hf-cache:
  claude-config:
  azure-config:
