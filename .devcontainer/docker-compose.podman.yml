# Rootless-podman overlay. Use together with docker-compose.yml:
#   podman compose -f .devcontainer/docker-compose.yml -f .devcontainer/docker-compose.podman.yml up -d
# (the podman devcontainer variant does this for you).
#
# Three things differ from Docker:
#
#  1. Socket. The container engine API is the user's podman socket, not
#     /var/run/docker.sock. It is still mounted at /var/run/docker.sock inside,
#     so the docker CLI, Aspire (DCP) and Testcontainers find it with defaults.
#
#  2. userns keep-id. Maps host UID 1000 to container UID 1000 (`vscode`), so
#     the bind-mounted workspace and the podman socket (owned by the host user)
#     are writable/usable by vscode. Without it vscode is a sub-UID and gets
#     "permission denied" on both.
#
#  3. Host network. Containers started *from inside* the dev container (Aspire
#     resources, Testcontainers) run as siblings on the host and publish their
#     ports there. With host networking `localhost:<port>` inside the dev
#     container is the host, so Aspire's DCP and Testcontainers reach them
#     without any address rewriting. Namespaced sysctls cannot be set in host
#     network mode, so they are reset here.
services:
  dev:
    userns_mode: keep-id
    network_mode: host
    sysctls: !reset {}
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      # Ryuk (Testcontainers' reaper) needs to bind-mount the socket into its own
      # container, which rootless podman does not allow from a nested path.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_HOST_OVERRIDE: localhost
